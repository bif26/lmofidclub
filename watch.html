<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشاهدة الدرس | Lmofid Club</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
      tailwind.config = {
          darkMode: 'class',
          theme: {
              extend: {
                  colors: {
                      brand: { 600: '#4f46e5' }
                  },
                  fontFamily: {
                      cairo: ['Cairo', 'sans-serif'],
                  }
              }
          }
      }
  </script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { 
        font-family: 'Cairo', sans-serif; 
        background-color: #020617; /* Slate 950 */
    }
    
    /* Modern Video Player Customization base */
    video::-webkit-media-controls-panel {
        background: linear-gradient(transparent, rgba(0,0,0,0.8));
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white antialiased">
  
  <header class="bg-slate-900/50 border-b border-slate-800/80 backdrop-blur-md sticky top-0 z-20 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
        
        <div class="flex items-center gap-3 sm:gap-4 overflow-hidden">
            <a href="./index.html" class="flex-shrink-0 w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:bg-slate-700 hover:text-white transition">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <div class="truncate">
                <span id="lessonNumberBadge" class="inline-block mb-1 text-[10px] font-bold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2 py-0.5 rounded-full">
                    جاري التحميل...
                </span>
                <h1 id="lessonTitle" class="text-sm sm:text-lg lg:text-xl font-bold truncate">...</h1>
            </div>
        </div>

        <button id="markCompleteBtn" onclick="toggleCompletion()" class="hidden sm:flex flex-shrink-0 items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all border shadow-lg">
            <!-- Populated dynamically via JS -->
        </button>
    </div>
  </header>

  <main class="flex-1 flex flex-col max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
    
    <div class="relative rounded-2xl overflow-hidden border border-slate-800 bg-black shadow-2xl shadow-indigo-900/10 w-full group">
        <!-- Glow Effect behind player -->
        <div class="absolute -inset-1 bg-gradient-to-tr from-indigo-500/20 to-purple-500/20 rounded-2xl blur-xl z-0 opacity-50 group-hover:opacity-100 transition duration-1000"></div>
        
        <video id="player" controls playsinline preload="metadata" class="relative z-10 w-full aspect-video max-h-[75vh] bg-black rounded-xl">
            <source id="playerSource" src="" type="video/mp4" />
            متصفحك لا يدعم تشغيل الفيديو.
        </video>
    </div>

    <!-- Error & Fallback Container -->
    <div id="errorBox" class="hidden rounded-xl border border-red-500/30 bg-red-950/30 p-5 text-sm text-red-200 shadow-inner flex items-start gap-4">
        <i class="fa-solid fa-triangle-exclamation text-2xl text-red-400 mt-1"></i>
        <div>
            <h4 class="font-bold text-base mb-1 text-red-300">عذراً، لم نتمكن من تشغيل الفيديو مباشرة</h4>
            <p class="text-xs text-red-200/80 mb-3">قد يكون رابط الفيديو محميًا (مثلاً يوتيوب أو فيميو) أو بصيغة غير مدعومة لمشغل HTML5 المدمج.</p>
            <a id="openRawLink" href="#" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-red-900/50 hover:bg-red-800 text-white text-xs font-bold transition">
                <i class="fa-solid fa-external-link-alt"></i> فتح الرابط في المتصفح
            </a>
        </div>
    </div>
    
    <!-- Mobile Complete Button -->
    <button id="markCompleteBtnMobile" onclick="toggleCompletion()" class="sm:hidden w-full flex justify-center items-center gap-2 px-4 py-3 rounded-xl text-sm font-bold transition-all border shadow-lg mt-4">
        <!-- Populated dynamically via JS -->
    </button>
  </main>

  <script>
    const titleEl = document.getElementById('lessonTitle');
    const badgeEl = document.getElementById('lessonNumberBadge');
    const player = document.getElementById('player');
    const source = document.getElementById('playerSource');
    const errorBox = document.getElementById('errorBox');
    const openRawLink = document.getElementById('openRawLink');
    
    const btnDesktop = document.getElementById('markCompleteBtn');
    const btnMobile = document.getElementById('markCompleteBtnMobile');

    // Parse URL Parameters
    const params = new URLSearchParams(window.location.search);
    const lessonNum = params.get('id');       
    const directUrl = params.get('url');    
    const directTitle = params.get('title');

    // LocalStorage keys matching index.html
    const COMPLETED_KEY = 'lmofid_completed';
    let currentLessonId = lessonNum ? `lesson-${lessonNum}` : null;
    let completedLessons = JSON.parse(localStorage.getItem(COMPLETED_KEY) || '[]');

    function updateCompletionButtons() {
        if (!currentLessonId) {
            btnDesktop.style.display = 'none';
            btnMobile.style.display = 'none';
            return;
        }

        const isCompleted = completedLessons.includes(currentLessonId);
        
        const content = isCompleted 
            ? '<i class="fa-solid fa-circle-check"></i> تم المشاهدة بنجاح' 
            : '<i class="fa-solid fa-check"></i> تحديد كدرس مكتمل';
            
        const className = isCompleted
            ? 'border-emerald-500/40 bg-slate-900 text-emerald-400 hover:bg-slate-800'
            : 'border-emerald-500/20 bg-emerald-600 text-white hover:bg-emerald-500 shadow-emerald-600/20';

        // Keep existing base classes, just swap colors
        btnDesktop.className = `hidden sm:flex flex-shrink-0 items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all border shadow-lg ${className}`;
        btnMobile.className = `sm:hidden w-full flex justify-center items-center gap-2 px-4 py-3 rounded-xl text-sm font-bold transition-all border shadow-lg mt-4 ${className}`;

        btnDesktop.innerHTML = content;
        btnMobile.innerHTML = content;
    }

    function toggleCompletion() {
        if (!currentLessonId) return;

        if (completedLessons.includes(currentLessonId)) {
            completedLessons = completedLessons.filter(id => id !== currentLessonId);
        } else {
            completedLessons.push(currentLessonId);
        }
        
        localStorage.setItem(COMPLETED_KEY, JSON.stringify(completedLessons));
        updateCompletionButtons();
    }

    async function loadFromJsonById(id) {
        try {
            const res = await fetch('https://raw.githubusercontent.com/bif26/lmofidclub/main/lmofidclub_links.json');
            if (!res.ok) throw new Error();
            const data = await res.json();

            const index = Number(id) - 1;
            if (Number.isNaN(index) || index < 0 || index >= data.length) {
                throw new Error('Lesson out of bounds');
            }

            return {
                title: data[index].title || `الدرس ${id}`,
                url: data[index].url || ''
            };
        } catch(e) {
            // Fallback if network fails
            return {
                title: `الدرس ${id}`,
                url: ''
            };
        }
    }

    function setVideo(lesson) {
        titleEl.textContent = lesson.title || 'مشاهدة الدرس';
        badgeEl.textContent = lessonNum ? `الدرس #${lessonNum}` : 'مشاهدة مباشرة';

        source.src = lesson.url || '';
        
        // Basic check if it's a Youtube link to show error early
        if (source.src.includes('youtube.com') || source.src.includes('youtu.be')) {
            showExternalLinkError(lesson.url);
        } else {
            player.load();
            // Automatically attempt play (might be blocked by browser policies until interaction)
            player.play().catch(e => console.log("Auto-play prevented by browser policy", e));
        }

        openRawLink.href = lesson.url || '#';
        updateCompletionButtons();
    }

    function showExternalLinkError(url) {
        player.style.display = 'none'; // Hide native player if it's external
        errorBox.classList.remove('hidden');
        openRawLink.href = url || '#';
    }

    async function init() {
        try {
            let lesson;

            if (directUrl || directTitle) {
                // Prioritize URL parameters sent from index.html for speed
                lesson = {
                    title: directTitle || 'مشاهدة الدرس',
                    url: directUrl || ''
                };
            } else if (lessonNum) {
                lesson = await loadFromJsonById(lessonNum);
            } else {
                titleEl.textContent = 'رابط غير صالح';
                badgeEl.textContent = 'خطأ';
                throw new Error('يجب تمرير رقم الدرس أو الرابط للمشاهدة.');
            }

            setVideo(lesson);
        } catch (err) {
            showExternalLinkError('#');
        }
    }

    // Trigger error if HTML5 video fails to load the source format
    player.addEventListener('error', () => {
        showExternalLinkError(source.src);
    });

    init();
  </script>
</body>
</html>
