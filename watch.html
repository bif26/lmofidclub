<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشاهدة الدرس | Lmofid Club</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8 space-y-4">
    <div class="flex items-center justify-between gap-3">
      <h1 id="lessonTitle" class="text-lg sm:text-2xl font-extrabold">جاري تحميل الدرس...</h1>
      <a href="./index.html" class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs sm:text-sm hover:bg-slate-700">
        العودة للدروس
      </a>
    </div>

    <p id="lessonMeta" class="text-xs sm:text-sm text-slate-400">يرجى الانتظار...</p>

    <div class="rounded-2xl overflow-hidden border border-slate-800 bg-black">
      <video id="player" controls playsinline preload="metadata" class="w-full max-h-[75vh] bg-black">
        <source id="playerSource" src="" type="video/mp4" />
        متصفحك لا يدعم تشغيل الفيديو.
      </video>
    </div>

    <div id="errorBox" class="hidden rounded-xl border border-red-500/30 bg-red-950/30 p-4 text-sm text-red-200">
      تعذر تشغيل الفيديو مباشرة. قد يكون الرابط محميًا أو غير مدعوم داخل مشغل HTML5.
      <br />
      <a id="openRawLink" href="#" target="_blank" class="underline font-bold">فتح رابط الدرس مباشرة</a>
    </div>
  </main>

  <script>
    const titleEl = document.getElementById('lessonTitle');
    const metaEl = document.getElementById('lessonMeta');
    const player = document.getElementById('player');
    const source = document.getElementById('playerSource');
    const errorBox = document.getElementById('errorBox');
    const openRawLink = document.getElementById('openRawLink');

    const params = new URLSearchParams(window.location.search);
    const lessonId = params.get('id');      // watch.html?id=12
    const directUrl = params.get('url');    // watch.html?url=https://...
    const directTitle = params.get('title');

    async function loadFromJsonById(id) {
      const res = await fetch('./lmofidclub_links.json');
      if (!res.ok) throw new Error('تعذر تحميل ملف الدروس lmofidclub_links.json');
      const data = await res.json();

      const index = Number(id) - 1;
      if (Number.isNaN(index) || index < 0 || index >= data.length) {
        throw new Error('رقم الدرس غير صحيح');
      }

      return {
        title: data[index].title || `الدرس ${id}`,
        url: data[index].url || ''
      };
    }

    function setVideo(lesson) {
      titleEl.textContent = lesson.title || 'مشاهدة الدرس';
      metaEl.textContent = lesson.url ? 'تم تحميل رابط الدرس' : 'لا يوجد رابط صالح لهذا الدرس';

      source.src = lesson.url || '';
      player.load();

      openRawLink.href = lesson.url || '#';
    }

    async function init() {
      try {
        let lesson;

        if (directUrl) {
          lesson = {
            title: directTitle || 'مشاهدة الدرس',
            url: directUrl
          };
        } else if (lessonId) {
          lesson = await loadFromJsonById(lessonId);
        } else {
          throw new Error('يجب تمرير id أو url في الرابط');
        }

        setVideo(lesson);
      } catch (err) {
        titleEl.textContent = 'حدث خطأ أثناء تحميل الدرس';
        metaEl.textContent = err.message;
        errorBox.classList.remove('hidden');
      }
    }

    player.addEventListener('error', () => {
      errorBox.classList.remove('hidden');
    });

    init();
  </script>
</body>
</html>
